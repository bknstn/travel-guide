name: CodeRabbit AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  coderabbit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: CodeRabbit AI Review
        uses: coderabbitai/coderabbit-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

